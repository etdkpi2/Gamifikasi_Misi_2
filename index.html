<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CANVAS VALIDATOR · Periksa draf blueprint sesuai SOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1E5BC6; --brand2:#2463C8; --brandD:#143F8C; --acc:#FFB703; --acc2:#FB8500;
  --ok:#22A06B; --okL:#E3F7EC; --bad:#E5484D; --badL:#FDECEC; --ink:#1F2A44; --mute:#6B7690;
  --paper:#FFFFFF; --minFs:30px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0E1A33;overflow:hidden;height:600px}
#app{position:relative;width:100%;height:600px;overflow:hidden;background:#0E1A33;font-family:'Nunito',system-ui,sans-serif}
#stage{position:absolute;left:0;top:0;width:720px;height:1280px;transform-origin:0 0;overflow:hidden;color:var(--ink);user-select:none;-webkit-user-select:none;background:#F4F1EA}
#shake{position:absolute;inset:0}
#bg,#view,#hud,#dlg,#ovl,#fx,#wipe{position:absolute;inset:0}
#bg{z-index:0}
#bg svg{width:100%;height:100%;display:block}
#view{z-index:2}
#hud{z-index:6;height:104px;bottom:auto;display:none;align-items:center;gap:14px;padding:16px 108px 12px 20px;background:linear-gradient(#ffffffee,#ffffffcc);box-shadow:0 4px 18px #1f2a4422}
#hud.show{display:flex}
#dlg{z-index:20;display:none}
#dlg.show{display:block}
#dlg.dim{background:rgba(14,26,51,.42)}
#ovl{z-index:30;pointer-events:none}
#ovl>*{pointer-events:auto}
#fx{z-index:40;pointer-events:none}
#wipe{z-index:50;pointer-events:none}
#bgmBtn{position:absolute;z-index:60;right:20px;top:18px;width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:var(--brand);color:#fff;font-size:32px;cursor:pointer;box-shadow:0 6px 16px #1f2a4444;display:flex;align-items:center;justify-content:center;padding:0}
#bgmBtn.off{background:#8a93a8}
#foot{position:absolute;z-index:55;left:0;right:0;bottom:0;height:32px;display:flex;align-items:center;justify-content:center;font:600 19px 'Nunito',sans-serif;color:#5b6684;background:#ffffffcc;letter-spacing:.3px}
b{font-weight:900;color:var(--brandD)}
button{font-family:'Fredoka',sans-serif;cursor:pointer;-webkit-user-select:none;user-select:none}
.hide{display:none!important}

/* ---------- HUD ---------- */
.hLogo{width:72px;height:72px;flex:none}
.hLogo svg{width:100%;height:100%}
.chip{flex:none;font:700 26px 'Fredoka',sans-serif;color:#fff;background:var(--brand);padding:10px 20px;border-radius:999px;letter-spacing:1px;box-shadow:0 4px 0 var(--brandD)}
.sBox{flex:1;min-width:0}
.sTop{display:flex;justify-content:space-between;align-items:baseline;font:700 22px 'Fredoka',sans-serif;color:var(--mute);letter-spacing:1px}
.sTop b{font:700 34px 'Fredoka',sans-serif;color:var(--brand)}
.sBar{height:20px;border-radius:999px;background:#E2E7F2;overflow:hidden;margin-top:4px;box-shadow:inset 0 2px 4px #0002}
.sBar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s cubic-bezier(.2,.9,.3,1.2)}

/* ---------- START ---------- */
.startWrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:70px;background:linear-gradient(#ffffffd9,#ffffff99 60%,#ffffffd9)}
.startWrap .sLogo{width:150px;height:150px}
.startWrap .sLogo svg{width:100%;height:100%}
.title{font:700 80px/1 'Fredoka',sans-serif;color:var(--brand);margin-top:22px;letter-spacing:2px;text-shadow:0 5px 0 #fff,0 8px 0 #1e5bc633;text-align:center}
.subtitle{font:800 32px 'Nunito',sans-serif;color:var(--ink);margin-top:14px;background:var(--acc);padding:8px 24px;border-radius:14px;transform:rotate(-1.5deg)}
.startChar{width:250px;margin-top:22px;height:470px}
.nameIn{margin-top:14px;width:520px;height:96px;border-radius:24px;border:5px solid var(--brand);font:800 var(--minFs) 'Nunito',sans-serif;text-align:center;color:var(--ink);outline:none;padding:0 20px;background:#fff;user-select:text;-webkit-user-select:text}
.nameIn:focus{box-shadow:0 0 0 8px #1e5bc633}
.bigBtn{margin-top:22px;width:520px;height:104px;border:none;border-radius:28px;background:var(--brand);color:#fff;font:700 44px 'Fredoka',sans-serif;box-shadow:0 8px 0 var(--brandD),0 14px 24px #1f2a4433;transition:transform .1s}
.bigBtn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--brandD)}
.soundNote{margin-top:22px;font:700 25px 'Nunito',sans-serif;color:var(--mute)}

/* ---------- CHARACTER ---------- */
.char{position:absolute;pointer-events:none}
.char svg{width:100%;height:auto;display:block;overflow:visible}
.char .armR,.char .armL{transform-box:view-box;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.char .armR{transform-origin:205px 270px}
.char .armL{transform-origin:95px 270px}
.char .body{transform-box:view-box;transform-origin:150px 540px}
.char.p-idle .body{animation:breathe 3s ease-in-out infinite}
.char.p-wave .armR{animation:waveA .55s ease-in-out infinite alternate}
.char.p-scratch .armR{transform:rotate(-163deg);animation:scratchA .35s ease-in-out infinite alternate}
.char.p-scratch .body{transform:rotate(-2deg)}
.char.p-cheer .armR{transform:rotate(-150deg)}
.char.p-cheer .armL{transform:rotate(150deg)}
.char.p-cheer .body{animation:hop .5s ease-in-out infinite alternate}
.char .upper{transform-box:view-box;transform-origin:150px 410px}
.char .map,.char .watch{display:none}
.char.p-map .map{display:inline}
.char.nomap .map{display:none}
.char.p-map .armR{transform:rotate(13deg)}
.char.p-map .armL{transform:rotate(-13deg)}
.char.p-watch .watch{display:inline}
.char.p-watch .armL{transform:rotate(-72deg)}
.char.p-watch .body{transform:rotate(2deg)}
@keyframes breathe{50%{transform:scaleY(1.012)}}
@keyframes waveA{from{transform:rotate(-122deg)}to{transform:rotate(-160deg)}}
@keyframes scratchA{from{transform:rotate(-160deg)}to{transform:rotate(-168deg)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-14px)}}

/* ---------- DIALOG ---------- */
.dChar{position:absolute}
#dlg.mode-big .dChar{left:150px;bottom:100px;width:420px}
#dlg.mode-side .dChar{left:-6px;bottom:70px;width:310px}
.bub{position:absolute;left:34px;right:34px;background:#fff;border-radius:34px;padding:54px 34px 46px;box-shadow:0 12px 30px #1f2a4433;border:5px solid var(--brand)}
#dlg.mode-big .bub{top:150px}
#dlg.mode-side .bub{top:360px}
.bub:after{content:'';position:absolute;bottom:-30px;width:44px;height:44px;background:#fff;border-right:5px solid var(--brand);border-bottom:5px solid var(--brand);transform:rotate(45deg) skew(8deg,8deg);border-radius:0 0 10px 0}
#dlg.mode-big .bub:after{left:300px;bottom:-26px}
#dlg.mode-side .bub:after{left:120px;bottom:-26px}
.bName{position:absolute;top:-28px;left:28px;color:#fff;padding:8px 24px;border-radius:999px;font:600 30px 'Fredoka',sans-serif;box-shadow:0 4px 0 #0003}
.bName small{font:500 21px 'Nunito',sans-serif;opacity:.92;margin-left:6px}
.bTxt{font:700 34px/1.42 'Nunito',sans-serif;min-height:96px}
.bNext{position:absolute;right:26px;bottom:10px;font:600 23px 'Fredoka',sans-serif;color:var(--brand);opacity:0}
.bub.ready .bNext{opacity:1;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#ava{position:absolute;inset:0;z-index:32;pointer-events:none;display:none}
#ava.show{display:block}
.avaBox{position:absolute;left:14px;bottom:192px;width:170px;height:188px;overflow:hidden}
.avaBox .char{left:0;top:14px;width:170px}
.avaBub{position:absolute;left:196px;bottom:236px;max-width:470px;background:#fff;border:4px solid var(--brand);border-radius:26px;padding:14px 22px;font:800 27px/1.35 'Nunito',sans-serif;color:var(--ink);box-shadow:0 8px 18px #1f2a4433;opacity:0;transform-origin:0 100%}
.avaBub:before{content:'';position:absolute;left:-15px;bottom:22px;width:24px;height:24px;background:#fff;border-left:4px solid var(--brand);border-bottom:4px solid var(--brand);transform:rotate(45deg)}
#ovl.inDraft .ovl{padding:30px 30px 400px}
#ovl.inDraft .mag,#ovl.inDraft .pnl{max-height:850px}
.flyMap{position:absolute;transform-origin:50% 50%;z-index:2}
.flyMap svg{width:100%;height:100%;display:block;overflow:visible}

/* ---------- PANEL ---------- */
.ovl{position:absolute;inset:0;background:rgba(14,26,51,.55);display:flex;align-items:center;justify-content:center;padding:30px}
.pnl{width:640px;max-height:1150px;background:#fff;border-radius:36px;padding:40px 36px 36px;box-shadow:0 20px 50px #0006;display:flex;flex-direction:column;position:relative;overflow:hidden}
.pnl h2{margin:0 0 14px;font:700 46px/1.1 'Fredoka',sans-serif;color:var(--brand);text-align:center}
.pnl .pBody{overflow-y:auto;font:700 30px/1.42 'Nunito',sans-serif;-webkit-overflow-scrolling:touch}
.pnl .pBtns{display:flex;gap:16px;margin-top:24px}
.pBtn{flex:1;min-height:96px;border:none;border-radius:24px;background:var(--brand);color:#fff;font:700 36px 'Fredoka',sans-serif;box-shadow:0 7px 0 var(--brandD)}
.pBtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--brandD)}
.pBtn.ghost{background:#E8EDF7;color:var(--brand);box-shadow:0 7px 0 #c6d0e4}
.pnl.bad{border:6px solid var(--bad)}
.pnl.bad h2{color:var(--bad)}
.steps{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.stp{display:flex;align-items:center;gap:20px;background:#F2F6FD;border-radius:24px;padding:18px 20px}
.stp .ic{flex:none;width:96px;height:96px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #d6def0;position:relative}
.stp .ic svg{width:66px;height:66px}
.stp .ic em{position:absolute;top:-10px;left:-10px;width:40px;height:40px;border-radius:50%;background:var(--acc);font:700 24px/40px 'Fredoka',sans-serif;color:var(--ink);text-align:center;font-style:normal}
.stp h4{margin:0;font:700 32px 'Fredoka',sans-serif;color:var(--brandD)}
.stp p{margin:4px 0 0;font:700 24px/1.35 'Nunito',sans-serif;color:var(--mute)}
.warn{margin-top:18px;display:flex;align-items:center;gap:14px;background:var(--badL);color:var(--bad);border-radius:20px;padding:16px 20px;font:800 27px 'Nunito',sans-serif}
.warn svg{width:48px;height:48px;flex:none}

/* ---------- BOARD / CANVAS ---------- */
.board{position:absolute;left:46px;right:46px;top:118px;bottom:380px;background:linear-gradient(135deg,#C68E58,#A8733F);border-radius:30px;padding:46px 16px 16px;box-shadow:0 14px 30px #4a2e1255,inset 0 -6px 0 #0002}
.clip{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:230px;height:70px;border-radius:16px 16px 22px 22px;background:linear-gradient(#EEF1F6,#AEB6C6);box-shadow:0 6px 10px #0004,inset 0 -6px 0 #0001;z-index:3}
.clip:before{content:'';position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:90px;height:38px;border-radius:20px 20px 0 0;border:9px solid #A9B1C2;border-bottom:none}
.clip:after{content:'';position:absolute;left:40px;right:40px;top:26px;height:8px;border-radius:4px;background:#8F98AC}
.paper{position:absolute;left:16px;right:16px;top:46px;bottom:16px;background:var(--paper);border-radius:14px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:40px 24px 30px;box-shadow:0 2px 0 #0001;overscroll-behavior:contain}
.paper::-webkit-scrollbar{width:10px}
.paper::-webkit-scrollbar-thumb{background:#c9d2e3;border-radius:5px}
.dLabel{display:flex;align-items:center;gap:12px;font:700 34px 'Fredoka',sans-serif;color:var(--ink)}
.dLabel span{background:var(--acc);padding:4px 16px;border-radius:12px;font-size:28px}
.ctx{margin:16px 0 22px;border:3px dashed #B9C6E0;border-radius:20px;padding:16px 20px;background:#F6F9FF;font:700 24px/1.4 'Nunito',sans-serif}
.ctx div{display:flex;gap:10px}
.ctx div+div{margin-top:4px}
.ctx em{font-style:normal;flex:none;width:150px;color:var(--mute);font-weight:800}
.ctx strong{color:var(--ink);font-weight:800}
.cards{display:flex;flex-direction:column;gap:16px;position:relative}
.colCard{position:relative;display:flex;border-radius:20px;background:#fff;border:3px solid #DCE3F0;box-shadow:0 5px 0 #DCE3F0;cursor:pointer;min-height:118px;transition:transform .12s,border-color .2s,background .2s}
.colCard:active{transform:scale(.985)}
.cLab{flex:none;width:176px;padding:16px 14px;background:#EEF3FC;border-radius:17px 0 0 17px;display:flex;flex-direction:column;justify-content:center;border-right:3px solid #DCE3F0}
.cLab span{font:700 19px 'Fredoka',sans-serif;letter-spacing:1.5px;color:var(--brand)}
.cLab b{font:700 25px/1.15 'Fredoka',sans-serif;color:var(--ink);margin-top:4px}
.cVal{flex:1;padding:16px 66px 16px 18px;font:700 24px/1.4 'Nunito',sans-serif;display:flex;flex-direction:column;justify-content:center;word-break:break-word}
.cVal div+div{margin-top:4px}
.cStat{position:absolute;right:12px;top:12px;width:46px;height:46px;border-radius:50%;background:#E2E7F2;color:#7d879c;font:700 28px/46px 'Fredoka',sans-serif;text-align:center}
.colCard.chk{border:3px dashed #1E5BC6}
.colCard.locked{cursor:default}
.colCard.locked .cStat{display:none}
.colCard.done .cStat{background:#22B573;color:#fff}
.chkTag{position:absolute;left:12px;top:-13px;z-index:3;background:#1E5BC6;color:#fff;font:700 17px 'Fredoka',sans-serif;padding:3px 12px;border-radius:999px;letter-spacing:1px;pointer-events:none;box-shadow:0 2px 0 #143F8C}
.colCard.hintPulse{border-color:var(--acc);animation:hintGlow 1s ease-in-out infinite}
@keyframes hintGlow{0%,100%{box-shadow:0 5px 0 #f3c75c,0 0 0 0 #ffb70388}50%{box-shadow:0 5px 0 #f3c75c,0 0 0 14px #ffb70300}}
.hintLbl{position:absolute;z-index:4;right:10px;top:-20px;background:var(--acc);color:var(--ink);font:700 22px 'Fredoka',sans-serif;padding:6px 16px;border-radius:999px;box-shadow:0 4px 0 #d79a00;pointer-events:none;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.hand{position:absolute;width:86px;height:86px;pointer-events:none;z-index:5;animation:tapHand 1.1s ease-in-out infinite}
.hand svg{width:100%;height:100%}
@keyframes tapHand{0%,100%{transform:translate(0,0) scale(1)}45%{transform:translate(-8px,-8px) scale(1)}60%{transform:translate(-8px,-8px) scale(.86)}}
.bottomBar{position:absolute;left:22px;right:22px;bottom:46px;height:146px;display:flex;gap:18px}
.temuan{flex:none;width:210px;border-radius:26px;background:#fff;border:4px solid var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 var(--brandD)}
.temuan span{font:700 23px 'Fredoka',sans-serif;letter-spacing:2px;color:var(--mute)}
.temuan b{font:700 54px 'Fredoka',sans-serif;color:var(--brand);line-height:1.05}
.approve{flex:1;border:none;border-radius:26px;background:linear-gradient(#2EB67D,var(--ok));color:#fff;font:700 50px 'Fredoka',sans-serif;letter-spacing:2px;box-shadow:0 8px 0 #157a4f,0 14px 24px #1f2a4433}
.approve:active{transform:translateY(6px);box-shadow:0 2px 0 #157a4f}
.approve.ready{animation:approvePulse 1s ease-in-out infinite}
@keyframes approvePulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.04);filter:brightness(1.12)}}

/* ---------- INSPECT (kaca pembesar) ---------- */
.mag{width:650px;max-height:1160px;background:#fff;border-radius:38px;box-shadow:0 22px 60px #0007;display:flex;flex-direction:column;overflow:hidden;border:6px solid var(--brand)}
.magTop{display:flex;align-items:center;gap:18px;padding:22px 24px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;flex:none}
.lens{flex:none;width:92px;height:92px}
.lens svg{width:100%;height:100%}
.magTop small{font:700 22px 'Fredoka',sans-serif;letter-spacing:2px;opacity:.9}
.magTop h3{margin:2px 0 0;font:700 38px/1.1 'Fredoka',sans-serif}
.magTop .x{margin-left:auto;flex:none;width:68px;height:68px;border-radius:50%;border:none;background:#ffffff33;color:#fff;font:700 34px 'Fredoka',sans-serif}
.magBody{padding:24px 26px 28px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.magVal{position:relative;border-radius:24px;padding:24px 24px;background:radial-gradient(circle at 30% 20%,#FFFFFF,#F2F6FD);border:3px solid #CBD6EC;font:800 30px/1.42 'Nunito',sans-serif;box-shadow:inset 0 0 0 8px #fff,inset 0 0 30px #1e5bc622}
.magVal div+div{margin-top:6px}
.magVal.fixed{background:var(--okL);border-color:var(--ok)}
.ruleBtn{margin-top:18px;width:100%;min-height:80px;border-radius:20px;border:3px solid var(--acc);background:#FFF6DA;color:#8a5a00;font:700 30px 'Fredoka',sans-serif}
.ruleBox{margin-top:12px;border-radius:20px;background:#FFFBEF;border:3px solid #F4D27A;padding:16px 22px}
.ruleBox h4{margin:0 0 6px;font:700 28px 'Fredoka',sans-serif;color:#8a5a00}
.ruleBox ul{margin:0;padding-left:28px;font:700 25px/1.42 'Nunito',sans-serif}
.act{display:flex;gap:16px;margin-top:20px}
.act button{flex:1;min-height:110px;border:none;border-radius:26px;font:700 33px/1.1 'Fredoka',sans-serif;color:#fff}
.bOk{background:var(--ok);box-shadow:0 7px 0 #157a4f}
.bRev{background:var(--bad);box-shadow:0 7px 0 #a8262b}
.act button:active{transform:translateY(5px);box-shadow:none}
.optsH{margin:22px 0 10px;font:700 30px 'Fredoka',sans-serif;color:var(--brandD)}
.opt{display:block;width:100%;text-align:left;margin-top:14px;min-height:90px;border-radius:22px;border:4px solid #CBD6EC;background:#fff;padding:18px 22px;font:800 27px/1.38 'Nunito',sans-serif;color:var(--ink);box-shadow:0 5px 0 #CBD6EC}
.opt div+div{margin-top:4px}
.opt:active{transform:translateY(3px)}
.opt.no{border-color:var(--bad);background:var(--badL);color:#a8262b;box-shadow:0 5px 0 #f3b6b8;opacity:.75;pointer-events:none}
.opt.yes{border-color:var(--ok);background:var(--okL);box-shadow:0 5px 0 #9fdcbc}
.opt[disabled]{pointer-events:none}
.msg{margin-top:16px;border-radius:22px;padding:18px 22px;font:700 27px/1.42 'Nunito',sans-serif}
.msg h5{margin:0 0 6px;font:700 32px 'Fredoka',sans-serif}
.msg.red{background:var(--badL);border:4px solid var(--bad);color:#7d1d21}
.msg.red h5{color:var(--bad)}
.msg.green{background:var(--okL);border:4px solid var(--ok);color:#124f35}
.msg.green h5{color:var(--ok)}
.msg.mini{padding:12px 18px;font-size:25px}
.msg .pBtn{margin-top:16px;width:100%}

/* ---------- ALARM / STAMP ---------- */
.siren{position:absolute;left:50%;top:150px;width:150px;height:150px;margin-left:-75px;z-index:45}
.siren .beam{position:absolute;left:-235px;top:-235px;width:620px;height:620px;border-radius:50%;background:conic-gradient(from 0deg,#ff3b3b00 0deg,#ff3b3b88 30deg,#ff3b3b00 60deg,#ff3b3b00 180deg,#ff3b3b88 210deg,#ff3b3b00 240deg);animation:spin .6s linear infinite}
.siren .dome{position:absolute;left:25px;top:10px;width:100px;height:100px;border-radius:50px 50px 14px 14px;background:radial-gradient(circle at 40% 30%,#ffb3b3,#ff2a2a 50%,#b30000);box-shadow:0 0 50px 16px #ff3030aa;animation:domeB .3s steps(2) infinite}
.siren .base{position:absolute;left:10px;top:104px;width:130px;height:34px;border-radius:10px;background:#3b4256}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes domeB{50%{filter:brightness(1.5)}}
.flash{position:absolute;inset:0;background:#ff1f1f;opacity:0;z-index:44;pointer-events:none}
.stamp{position:absolute;left:50%;top:44%;z-index:8;transform:translate(-50%,-50%) rotate(-14deg);border:12px solid var(--ok);color:var(--ok);border-radius:26px;padding:12px 40px;font:700 104px/1 'Fredoka',sans-serif;letter-spacing:6px;background:#ffffffd9;box-shadow:0 0 0 6px #ffffffd9;pointer-events:none;text-shadow:0 0 1px var(--ok)}
.stamp small{display:block;text-align:center;font:700 26px 'Fredoka',sans-serif;letter-spacing:4px;margin-top:6px}
.sumItem{border-radius:22px;background:#F6F9FF;border:3px solid #DCE3F0;padding:18px 20px;margin-top:14px}
.sumItem h4{margin:0;font:700 28px 'Fredoka',sans-serif;color:var(--brand)}

.conf{position:absolute;width:16px;height:26px;border-radius:4px}
.puffP{position:absolute;width:22px;height:22px;border-radius:50%;margin:-11px 0 0 -11px}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 200px 60px #ff1f1f;opacity:0}

.wipeP .wt{font:700 46px 'Fredoka',sans-serif;color:#fff;letter-spacing:2px}

.stat.r b{color:var(--bad)}

/* ---------- FIT / SCALE 720x1280 di tinggi 600px ---------- */
function fit(){
  const app=$('#app'),st=$('#stage');
  const ae=document.activeElement;
  const typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
  if(!(typing&&app.style.height)){
    const inFrame=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
    const vh=Math.round((window.visualViewport&&window.visualViewport.height)||window.innerHeight);
    app.style.height=(inFrame?600:vh)+'px';
 document.documentElement.style.height=document.body.style.height=app.style.height;
  }
  const w=app.clientWidth||window.innerWidth,h=app.clientHeight||600;
  const s=Math.min(w/720,h/1280);
  st.style.transform=`translate(${(w-720*s)/2}px,${(h-1280*s)/2}px) scale(${s})`;
  document.documentElement.style.setProperty('--minFs',Math.max(30,16/s)+'px');
}
function growFrame(){
  try{const fe=window.frameElement;if(fe){fe.style.height='600px';fe.style.minHeight='600px';fe.setAttribute('scrolling','no');}}catch(e){}
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({context:'h5p',action:'resize',scrollHeight:600},'*');}catch(e){}
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',()=>setTimeout(fit,200));
if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);

/* ---------- AUDIO SYSTEM (BGM mood + SFX, Web Audio) ---------- */
const MOODS={
  happy:{bpm:112,ch:[[60,64,67,72],[55,59,62,67],[57,60,64,69],[53,57,60,65]],arp:[0,2,1,3,2,1,3,2]},
  calm:{bpm:76,ch:[[53,57,60,64],[57,60,64,67],[50,53,57,60],[48,52,55,60]],arp:[0,1,2,3,2,1,0,2]},
  tense:{bpm:124,ch:[[45,48,52,57],[45,48,52,57],[46,50,53,58],[45,48,52,57]],arp:[0,0,1,0,0,2,0,3]},
  win:{bpm:126,ch:[[60,64,67,72],[65,69,72,77],[67,71,74,79],[60,64,67,72]],arp:[0,1,2,3,3,2,1,2]}
};
const AudioSys={
  ctx:null,master:null,bgmG:null,sfxG:null,on:true,mood:null,nextT:0,step:0,iv:null,nb:null,lastType:0,
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});return;}
    try{
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      this.ctx=new C();
      this.master=this.ctx.createGain();this.master.gain.value=.9;this.master.connect(this.ctx.destination);
      this.bgmG=this.ctx.createGain();this.bgmG.gain.value=this.on?.55:0;this.bgmG.connect(this.master);
      this.sfxG=this.ctx.createGain();this.sfxG.gain.value=.6;this.sfxG.connect(this.master);
      const len=this.ctx.sampleRate*1,buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.nb=buf;
      if(this.mood){const m=this.mood;this.mood=null;this.setMood(m);}
    }catch(e){this.ctx=null;}
  },
  m2f(m){return 440*Math.pow(2,(m-69)/12);},
  tone(f,t,d,o={}){
    if(!this.ctx)return;
    try{
      const c=this.ctx,os=c.createOscillator(),g=c.createGain();
      os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
      if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+(o.slideT||d));
      const pk=o.g||.2,at=o.a||.008;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      os.connect(g);
      let out=g;
      if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;g.connect(fl);out=fl;}
      out.connect(o.dest||this.sfxG);
      os.start(t);os.stop(t+d+.05);
    }catch(e){}
  },
  noise(t,d,o={}){
    if(!this.ctx||!this.nb)return;
    try{
      const c=this.ctx,src=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
      src.buffer=this.nb;fl.type=o.ft||'highpass';fl.frequency.value=o.f||6000;
      if(o.fTo)fl.frequency.exponentialRampToValueAtTime(o.fTo,t+d);
      const pk=o.g||.1;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+(o.a||.005));g.gain.exponentialRampToValueAtTime(.0001,t+d);
      src.connect(fl);fl.connect(g);g.connect(o.dest||this.sfxG);src.start(t);src.stop(t+d+.05);
    }catch(e){}
  },
  setMood(m){
    if(m===this.mood)return;
    this.mood=m;this.step=0;
    if(!this.ctx)return;
    this.nextT=this.ctx.currentTime+.08;
    if(!this.iv)this.iv=setInterval(()=>this.tick(),30);
  },
  tick(){
    if(!this.ctx||!this.mood||this.mood==='silence')return;
    const M=MOODS[this.mood];if(!M)return;
    const spb=60/M.bpm/2,now=this.ctx.currentTime;
    if(this.nextT<now-.2)this.nextT=now+.05;
    while(this.nextT<now+.15){this.play(this.mood,M,this.step,this.nextT,spb);this.nextT+=spb;this.step++;}
  },
  play(name,M,s,t,spb){
    const ch=M.ch[Math.floor(s/8)%M.ch.length],D=this.bgmG,f=n=>this.m2f(n);
    if(name==='happy'){
      if(s%4===0){this.tone(f(ch[0]-12),t,spb*1.8,{g:.12,dest:D});this.tone(110,t,.12,{to:45,g:.14,dest:D});}
      this.tone(f(ch[M.arp[s%8]]+12),t,spb*.9,{type:'triangle',g:.045,dest:D});
      if(s%2===1)this.noise(t,.04,{g:.012,dest:D});
    }else if(name==='calm'){
      if(s%8===0){ch.forEach(n=>this.tone(f(n),t,spb*8.4,{g:.022,a:.5,dest:D}));this.tone(f(ch[0]-12),t,spb*7.5,{g:.07,a:.2,dest:D});}
      if(s%2===0)this.tone(f(ch[M.arp[(s/2)%8]]+24),t,spb*3,{g:.016,dest:D});
    }else if(name==='tense'){
      this.tone(f(ch[0]-12),t,spb*.8,{type:'sawtooth',lp:520,g:.05,dest:D});
      if(s%4===0)this.tone(100,t,.15,{to:40,g:.16,dest:D});
      if(s%8===6)this.tone(f(ch[3]+12),t,.08,{type:'square',g:.018,dest:D});
    }else if(name==='win'){
      if(s%4===0){this.tone(f(ch[0]-12),t,spb*1.8,{g:.12,dest:D});this.tone(120,t,.12,{to:45,g:.14,dest:D});}
      this.tone(f(ch[M.arp[s%8]]+12),t,spb*.9,{type:'triangle',g:.05,dest:D});
      if(s%8===0)this.tone(f(ch[2]+24),t,spb*3,{g:.02,dest:D});
      if(s%2===1)this.noise(t,.04,{g:.014,dest:D});
    }
  },
  toggle(){
    this.on=!this.on;
    if(this.bgmG&&this.ctx)this.bgmG.gain.setTargetAtTime(this.on?.55:0,this.ctx.currentTime,.05);
    const b=$('#bgmBtn');b.textContent=this.on?'🎵':'🔇';b.classList.toggle('off',!this.on);
  },
  sfx(n){
    if(!this.ctx)return;
    const t=this.ctx.currentTime+.01;
    switch(n){
      case 'tap':this.tone(880,t,.07,{type:'square',g:.06});this.tone(1320,t+.03,.05,{type:'square',g:.04});break;
      case 'pop':this.tone(500,t,.12,{to:980,g:.2});break;
      case 'coin':this.tone(988,t,.09,{type:'square',g:.09});this.tone(1319,t+.08,.28,{type:'square',g:.09});break;
      case 'bad':this.tone(240,t,.32,{type:'sawtooth',to:120,g:.13,lp:1400});this.tone(180,t+.12,.3,{type:'sawtooth',to:90,g:.1,lp:1200});break;
      case 'alarm':for(let i=0;i<3;i++){const s=t+i*.6;this.tone(620,s,.3,{type:'sawtooth',to:1050,slideT:.3,g:.11,lp:2600});this.tone(1050,s+.3,.3,{type:'sawtooth',to:620,slideT:.3,g:.11,lp:2600});}break;
      case 'stamp':this.noise(t,.18,{ft:'lowpass',f:900,g:.5});this.tone(110,t,.28,{to:45,g:.5});break;
      case 'success':[523,659,784,1047].forEach((f,i)=>this.tone(f,t+.08+i*.09,.32,{type:'triangle',g:.12}));break;
      case 'chime':[1047,1319,1568,2093].forEach((f,i)=>this.tone(f,t+i*.11,1.1,{g:.07}));break;
      case 'type':{const now=performance.now();if(now-this.lastType<55)return;this.lastType=now;this.tone(1100+Math.random()*300,t,.025,{type:'square',g:.018});break;}
      case 'whoosh':this.noise(t,.45,{ft:'bandpass',f:400,fTo:3200,g:.12,a:.1});break;
      case 'open':this.tone(660,t,.08,{g:.12});this.tone(990,t+.06,.12,{g:.1});break;
    }
  }
};
$('#bgmBtn').addEventListener('click',e=>{e.stopPropagation();AudioSys.init();AudioSys.toggle();});

function typeIn(node,text){
  const segs=[];
  nm(text).split(/(\*\*.+?\*\*)/).forEach(p=>{if(!p)return;if(p.startsWith('**')&&p.endsWith('**')&&p.length>4)segs.push({t:p.slice(2,-2),b:1});else segs.push({t:p,b:0});});
  const total=segs.reduce((a,s)=>a+s.t.length,0);let n=0,res;
  const render=()=>{let left=n,h='';for(const s of segs){if(left<=0)break;const part=s.t.slice(0,left);left-=part.length;const e=esc(part).replace(/\n/g,'<br>');h+=s.b?`<b>${e}</b>`:e;}node.innerHTML=h;};
  const done=new Promise(r=>{res=r;});
  const tick=()=>{if(n>=total){render();res();return;}n+=RM?total:1;render();AudioSys.sfx('type');setTimeout(tick,26);};
  tick();
  return {skip(){n=total;render();res();},done:()=>done,get finished(){return n>=total;}};
}
async function say(who,text,o={}){
  const W=WHO[who]||{name:who,role:'',color:'#1E5BC6'};

  b.classList.remove('ready');

  b.innerHTML=`<div class="bName" style="background:${W.color}">${esc(W.name)}<small>${esc(W.role)}</small></div><div class="bTxt"></div><div class="bNext">tap untuk lanjut ▸</div>`;
  const ty=typeIn(b.querySelector('.bTxt'),text);
  await Promise.race([ty.done(),waitTap()]);
  if(!ty.finished)ty.skip();

}

const Ava={
  ch:null,bub:null,timer:null,iv:null,last:0,next:20000,active:false,paused:false,prev:{},
  show(){
    const a=$('#ava');if(!a)return;
    a.innerHTML='<div class="avaBox"></div><div class="avaBub"></div>';
    this.ch=el('div','char p-idle',charSVG('raka','smile'),a.querySelector('.avaBox'));
    this.bub=a.querySelector('.avaBub');
    a.style.visibility='';a.classList.add('show');
    this.active=true;this.paused=false;this.poke();
    A(this.ch,[{transform:'translateY(200px)'},{transform:'translateY(0)'}],{duration:450,easing:'cubic-bezier(.2,1.3,.4,1)'});
    clearInterval(this.iv);this.iv=setInterval(()=>this.tick(),500);
  },
  hide(){
    this.active=false;clearInterval(this.iv);this.iv=null;clearTimeout(this.timer);
    const a=$('#ava');if(a){a.classList.remove('show');a.style.visibility='';a.innerHTML='';}
    this.ch=null;this.bub=null;
  },
  pause(on){const a=$('#ava');if(a)a.style.visibility=on?'hidden':'';this.paused=on;if(!on)this.poke();},
  poke(){this.last=performance.now();this.next=15000+Math.random()*15000;},
  tick(){if(!this.active||this.paused||document.hidden)return;if(performance.now()-this.last>this.next){this.react('idle');this.poke();}},
  pick(kind){
    const R=GAME.reactions[kind],arr=R&&R.lines||[];if(!arr.length)return '';
    let i;do{i=Math.floor(Math.random()*arr.length);}while(arr.length>1&&i===this.prev[kind]);
    this.prev[kind]=i;return arr[i];
  },
  react(kind){
    if(!this.active||!this.ch||!this.bub)return;
    const R=GAME.reactions[kind];if(!R)return;
    setEx(this.ch,R.ex||'smile');setPose(this.ch,R.pose||'idle');
    A(this.ch,[{transform:'translateY(0)'},{transform:'translateY(-14px)'},{transform:'translateY(0)'}],{duration:340,easing:'ease-out'});
    const b=this.bub;b.innerHTML=md(this.pick(kind));
    clearTimeout(this.timer);
    A(b,[{opacity:0,transform:'scale(.7)'},{opacity:1,transform:'scale(1)'}],{duration:220,fill:'forwards',easing:'cubic-bezier(.2,1.4,.4,1)'});
    this.timer=setTimeout(()=>{
      if(this.bub)A(this.bub,[{opacity:1},{opacity:0}],{duration:250,fill:'forwards'});
      if(this.ch){setEx(this.ch,'smile');setPose(this.ch,'idle');}
    },2200);
  }
};
$('#stage').addEventListener('pointerdown',()=>Ava.poke());

/* ---------- SCENE: DRAF (puzzle validator) ---------- */
async function sceneDraft(pos){
  const D=GAME.drafts[S.order[pos]];
  const st=D.cols.map(c=>({status:'?',val:(c.no===1&&c.locked)?String(pos+1):c.val}));
  const errTotal=D.cols.filter(c=>!c.locked&&!c.ok).length;
  let finished=false;
  S.busy=true;
  setView('room');
  AudioSys.setMood('calm');
  $('#hud').classList.add('show');
  $('#hudLogo').innerHTML=LOGO;
  const lbl=GAME.ui.chip.replace('{n}',pos+1);
  $('#hudChip').textContent=lbl;
  setScore(S.score);
  const v=$('#view');
  const ctxHTML=D.ctx.note
    ?`<div><em>Konteks</em><strong>${esc(D.ctx.note)}</strong></div>`
    :`<div><em>Kompetensi</em><strong>${esc(D.ctx.komp)}</strong></div><div><em>Indikator</em><strong>${esc(D.ctx.ind)}</strong></div>`;
  v.innerHTML=`<div class="board" id="board"><div class="clip"></div><div class="paper" id="paper"><div class="dLabel"><span>📝</span>${esc(lbl)}</div><div class="ctx">${ctxHTML}</div><div class="cards" id="cards"></div></div></div>
  <div class="bottomBar"><div class="temuan"><span>${esc(GAME.ui.temuan)}</span><b id="temuanN">0/${errTotal}</b></div><button class="approve" id="approveBtn">${esc(GAME.ui.approve)}</button></div>`;
  const board=$('#board');board.style.visibility='hidden';
  const cardsEl=$('#cards');

  const fixedCount=()=>st.filter((s,i)=>!D.cols[i].locked&&!D.cols[i].ok&&s.status==='fixed').length;
  function render(){
    cardsEl.innerHTML=D.cols.map((c,i)=>{const s=st[i];const cls=c.locked?'locked':'chk'+(s.status==='?'?'':' done');const ic=c.locked?'':s.status==='?'?'?':'✓';
      return `<div class="colCard ${cls}" data-i="${i}">${c.locked?'':'<div class="chkTag">🔍 PERIKSA</div>'}<div class="cLab"><span>KOLOM ${c.no}</span><b>${esc(c.name)}</b></div><div class="cVal">${lines(s.val)}</div><div class="cStat">${ic}</div></div>`;}).join('');
    $('#temuanN').textContent=fixedCount()+'/'+errTotal;
    $('#approveBtn').classList.toggle('ready',fixedCount()===errTotal);
    if(pos===0&&!S.hinted){
      const first=cardsEl.querySelector('.colCard:not(.locked)');
      if(first){first.classList.add('hintPulse');el('div','hintLbl','👆 '+esc(GAME.ui.hint),first);const h=el('div','hand',ICON.hand,first);h.style.right='40px';h.style.bottom='-40px';}
    }
  }
  render();

  try{await mapToBoard(board,pos>0);}catch(err){console.error(err);board.style.visibility='visible';hideDlg();}
  $('#ovl').classList.add('inDraft');
  Ava.show();
  S.busy=false;

  cardsEl.addEventListener('click',async e=>{
    const card=e.target.closest('.colCard');if(!card||S.busy||finished)return;
    const i=+card.dataset.i;
    if(D.cols[i].locked){AudioSys.sfx('tap');toast(GAME.ui.locked);return;}
    S.busy=true;
    if(!S.hinted){S.hinted=true;}
    AudioSys.sfx('tap');
    try{await inspect(D,i,st,()=>render());}catch(err){console.error(err);}
    render();
    S.busy=false;
  });

  let resolveDone;const donePr=new Promise(r=>{resolveDone=r;});
  $('#approveBtn').addEventListener('click',async()=>{
    if(S.busy||finished)return;
    S.busy=true;
    try{
      const left=D.cols.some((c,i)=>!c.locked&&!c.ok&&st[i].status!=='fixed');
      if(left){
        addScore(-GAME.score.penalty);S.stats.early++;
        await alarm();
        st.forEach(s=>{if(s.status!=='fixed')s.status='?';});
        render();
      }else{
        finished=true;
        await approved(D,pos);
        resolveDone();
      }
    }catch(err){console.error(err);finished=true;resolveDone();}
    S.busy=false;
  });
  await Promise.race([donePr,until(()=>finished&&!S.busy)]);
  Ava.hide();$('#ovl').classList.remove('inDraft');
  $('#hud').classList.remove('show');
  const out=await wipe(pos<GAME.drafts.length-1?GAME.ui.chip.replace('{n}',pos+2):'');
  setView('room');
  await out();
}

/* Map terlepas dari pelukan Raka, terbang, lalu berubah menjadi lembar kanvas */
async function mapToBoard(board,withEnter){
  const c=showDlg('big','raka',{ex:'happy',pose:'map'});
  if(withEnter)await enterStyle(c,'walkR');
  await sleep(300);
  const mg=c.querySelector('.map');
  const sr=$('#stage').getBoundingClientRect(),k=sr.width/720||1;
  const mr=mg?mg.getBoundingClientRect():null;
  const w=mr&&mr.width?mr.width/k:126,h=mr&&mr.height?mr.height/k:154;
  const mp=mg?stagePt(mg):{x:360,y:860};
  const f=el('div','flyMap',mapSVG(),$('#fx'));
  f.style.left=(mp.x-w/2)+'px';f.style.top=(mp.y-h/2)+'px';f.style.width=w+'px';f.style.height=h+'px';
  c.classList.add('nomap');setPose(c,'cheer');
  AudioSys.sfx('whoosh');
  const tx=360-mp.x,ty=560-mp.y;
  const fly=A(f,[{transform:'translate(0,0) scale(1) rotate(0deg)',opacity:1},{transform:`translate(${tx*.45}px,${ty*.45-170}px) scale(2.1) rotate(-14deg)`,opacity:1,offset:.5},{transform:`translate(${tx}px,${ty}px) scale(4) rotate(8deg)`,opacity:0}],{duration:850,easing:'ease-in-out',fill:'forwards'});
  await sleep(RM?0:520);
  board.style.visibility='visible';
  const bc=stagePt(board);
  const grow=A(board,[{transform:`translate(${360-bc.x}px,${560-bc.y}px) scale(.2) rotate(8deg)`,opacity:0},{transform:'translate(0,0) scale(1) rotate(0deg)',opacity:1}],{duration:480,easing:'cubic-bezier(.2,1.3,.4,1)'});
  await Promise.all([fly,grow]);
  f.remove();
  setEx(c,'smile');setPose(c,'idle');
  await exitWalk(c,'left');
  hideDlg();
}

/* Panel kaca pembesar untuk satu kolom */
function inspect(D,i,st,onChange){
  return new Promise(resolve=>{
    const c=D.cols[i],s=st[i],R=GAME.rules[c.rule]||{title:'',lines:[]},U=GAME.ui;
    const o=el('div','ovl','',$('#ovl'));
    const m=el('div','mag',`<div class="magTop"><div class="lens">${ICON.lens}</div><div><small>KOLOM ${c.no}</small><h3>${esc(c.name)}</h3></div><button class="x" aria-label="Tutup">✕</button></div>
      <div class="magBody"><div class="magVal ${s.status==='fixed'?'fixed':''}">${lines(s.val)}</div>
      <button class="ruleBtn">${esc(U.ruleOpen)}</button>
      <div class="ruleBox hide"><h4>${esc(R.title)}</h4><ul>${R.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>
      <div class="act"><button class="bOk">${esc(U.btnOk)}</button><button class="bRev">${esc(U.btnRev)}</button></div>
      <div class="res"></div></div>`,o);
    AudioSys.sfx('open');
    A(m,[{transform:'scale(.3) rotate(-8deg)',opacity:0},{transform:'scale(1) rotate(0)',opacity:1}],{duration:360,easing:'cubic-bezier(.2,1.4,.4,1)'});
    const body=$('.magBody',m),res=$('.res',m),act=$('.act',m),rb=$('.ruleBtn',m),rbox=$('.ruleBox',m);
    let closed=false;
    const close=async()=>{if(closed)return;closed=true;await A(o,[{opacity:1},{opacity:0}],200);o.remove();resolve();};
    $('.x',m).addEventListener('click',()=>{AudioSys.sfx('tap');close();});
    rb.addEventListener('click',()=>{AudioSys.sfx('tap');const h=rbox.classList.toggle('hide');rb.textContent=h?U.ruleOpen:U.ruleClose;if(!h)A(rbox,[{opacity:0,transform:'translateY(-10px)'},{opacity:1,transform:'none'}],220);});
    const scrollEnd=()=>setTimeout(()=>{try{body.scrollTo({top:body.scrollHeight,behavior:RM?'auto':'smooth'});}catch(e){body.scrollTop=body.scrollHeight;}},60);
    $('.bOk',m).addEventListener('click',()=>{
      AudioSys.sfx('pop');
      if(s.status!=='fixed')s.status='ok';
      onChange();close();
    });
    $('.bRev',m).addEventListener('click',()=>{
      act.classList.add('hide');
      if(c.ok){
        AudioSys.sfx('bad');addScore(-GAME.score.penalty);S.stats.wrongMark++;Ava.react('falseFlag');
        const p=stagePt($('.bRev',m)||m);floatText(360,p.y||640,'−'+GAME.score.penalty,true);
        res.innerHTML=`<div class="msg red"><h5>${esc(U.wrongMarkTitle)}</h5>${esc(c.okWhy)}<button class="pBtn">${esc(U.wrongMarkBtn)}</button></div>`;
        A(res.firstChild,[{transform:'scale(.8)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:300,easing:'cubic-bezier(.2,1.4,.4,1)'});
        $('.pBtn',res).addEventListener('click',()=>{AudioSys.sfx('pop');s.status='ok';onChange();close();});
        scrollEnd();
        return;
      }
      if(s.status==='fixed'){close();return;}
      AudioSys.sfx('pop');
      res.innerHTML=`<div class="optsH">${esc(U.pickFix)}</div><div class="opts"></div><div class="fb"></div>`;
      const box=$('.opts',res),fb=$('.fb',res);
      shuffle(c.opts).forEach((op,k)=>{
        const b=el('button','opt',lines(op.t),box);
        A(b,[{transform:'translateY(20px)',opacity:0},{transform:'none',opacity:1}],{duration:280,delay:k*90,fill:'backwards'});
        b.addEventListener('click',()=>{
          if(b.disabled||b.classList.contains('no'))return;
          if(op.ok){
            $$('.opt',box).forEach(x=>x.disabled=true);
            b.classList.add('yes');
            AudioSys.sfx('coin');
            addScore(GAME.score.fix);S.stats.found++;Ava.react('found');
            const p=stagePt(b);floatText(p.x,p.y,'+'+GAME.score.fix);coinPop(p.x,p.y,6);puff(p.x,p.y);
            s.status='fixed';s.val=c.fixed;onChange();
            const mv=$('.magVal',m);mv.classList.add('fixed');mv.innerHTML=lines(c.fixed);
            A(mv,[{transform:'scale(1.06)'},{transform:'scale(1)'}],300);
            fb.innerHTML=`<div class="msg green"><h5>${esc(U.fixOkTitle)}</h5>${esc(c.why)}<button class="pBtn">${esc(U.fixOkBtn)}</button></div>`;
            A(fb.firstChild,[{transform:'scale(.8)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:300,easing:'cubic-bezier(.2,1.4,.4,1)'});
            $('.pBtn',fb).addEventListener('click',()=>{AudioSys.sfx('pop');close();});
            scrollEnd();
          }else{
            AudioSys.sfx('bad');addScore(-GAME.score.penalty);S.stats.wrongFix++;Ava.react('wrongFix');
            b.classList.add('no');b.disabled=true;
            A(b,[{transform:'translateX(0)'},{transform:'translateX(-14px)'},{transform:'translateX(12px)'},{transform:'translateX(-8px)'},{transform:'translateX(0)'}],380);
            const p=stagePt(b);floatText(p.x,p.y,'−'+GAME.score.penalty,true);
            fb.innerHTML=`<div class="msg red mini">${esc(U.fixBad)}</div>`;
            A(fb.firstChild,[{opacity:0},{opacity:1}],200);
          }
        });
      });
      scrollEnd();
    });
  });
}

    const steps=[sceneStart,sceneIntro,sceneHowto,()=>sceneDraft(0),()=>sceneDraft(1),()=>sceneDraft(2),sceneOutro,sceneEnd];

      try{await step();}
